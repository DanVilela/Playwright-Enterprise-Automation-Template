name: 🎭 Playwright Tests & Xray Upload

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      suite:
        description: 'Choose test suite'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

env:
  NODE_VERSION: 20
  BROWSERS: chromium

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: 📚 Install dependencies
        run: cd playwright-xray-ci-template && npm ci

      # 4️⃣ Install Playwright browsers
      - name: 🌐 Install Playwright browsers
        run: cd playwright-xray-ci-template && npx playwright install --with-deps ${{ env.BROWSERS }}

      # 5️⃣ Decide which suite to run
      - name: 🧠 Define test suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "suite=${{ github.event.inputs.suite }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suite=full" >> $GITHUB_OUTPUT
          else
            echo "suite=smoke" >> $GITHUB_OUTPUT
          fi

      # 6️⃣ Run tests
      - name: 🧪 Run tests
        run: |
          cd playwright-xray-ci-template
          echo "Running suite: ${{ steps.suite.outputs.suite }}"
          if [ "${{ steps.suite.outputs.suite }}" = "full" ]; then
            npm run test
          else
            npm run test:smoke
          fi
        env:
          BASE_URL: https://www.saucedemo.com
        continue-on-error: true

      # 7️⃣ Upload HTML report
      - name: 📤 Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-xray-ci-template/playwright-report/
          retention-days: 30

      # 8️⃣ Publish JUnit results
      - name: 📊 Publish JUnit report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results
          path: playwright-xray-ci-template/results.xml
          reporter: java-junit
          fail-on-error: false
        continue-on-error: true

      # 9️⃣ Upload to Xray
      - name: 🔗 Upload results to Xray Cloud
        if: always()
        run: |
          cd playwright-xray-ci-template
          TEST_TYPE=${{ steps.suite.outputs.suite }} npm run xray:upload
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}

      # 🔟 Comment PR with summary
      - name: 💬 Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'playwright-xray-ci-template/results.xml';

            if (!fs.existsSync(path)) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🧪 Test Results\n❌ Tests did not run - check workflow logs'
              });
              return;
            }

            const xml = fs.readFileSync(path, 'utf8');
            const total = (xml.match(/<testcase/g) || []).length;
            const failed = (xml.match(/<failure/g) || []).length;
            const passed = total - failed;

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const comment = `


